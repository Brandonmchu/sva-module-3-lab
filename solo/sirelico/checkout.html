<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 36px 24px;
      background: #4dff91 radial-gradient(circle, #22e870 2px, transparent 2.5px) 0 0 / 22px 22px;
      color: #eafff3;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
      isolation: isolate;
    }
    .card {
      width: min(100%, 720px);
      padding: clamp(24px, 6vw, 64px);
      background: #0d2b20;
      border: 4px solid #ff2d95;
      border-radius: 18px;
      box-shadow: 8px 8px 0 #052e22;
    }
    .eyebrow {
      margin: 0 0 24px;
      color: #ff2d95;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #39ff88;
      font-family: "Arial Black", Impact, sans-serif;
      font-size: clamp(36px, 6vw, 60px);
      font-weight: 900;
      line-height: 1.08;
      letter-spacing: -1px;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 #ff2d95;
    }
    .squiggle { display: block; width: 180px; height: 28px; margin: 20px 0 24px; color: #ff2d95; }
    .intro { margin: 0 0 32px; font-size: 19px; }
    .button {
      display: inline-block;
      padding: 15px 26px;
      border: 4px solid #052e22;
      border-radius: 999px;
      background: #ff2d95;
      color: #052e22;
      box-shadow: 5px 5px 0 #39ff88;
      font: 900 18px/1.3 Arial, Helvetica, sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }
    .button:hover, .button:focus-visible { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #39ff88; }
    .button:focus-visible { outline: 3px solid #eafff3; outline-offset: 6px; }
    .trip { padding: 18px 22px; margin-bottom: 28px; border: 2px solid #39ff88; border-radius: 10px; }
    .trip p { margin: 4px 0; font-size: 18px; }
    .pay .button { width: 100%; }
    .help { margin: 26px 0 0; font-size: 14px; }
    .zigzag { position: fixed; right: 0; bottom: 0; width: min(320px, 65vw); height: auto; color: #ff2d95; z-index: -1; pointer-events: none; }
    @media (max-width: 420px) {
      body { padding: 28px 20px; }
      .button { width: 100%; padding-inline: 16px; }
      .intro { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Your crew. Your getaway.</p>
    <h1>Almost wheels up!</h1>
    <svg class="squiggle" viewBox="0 0 180 28" aria-hidden="true" focusable="false">
      <path d="M4 14 Q15 0 26 14 T48 14 T70 14 T92 14 T114 14 T136 14 T158 14 T176 14" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" />
    </svg>
    <section class="trip" aria-label="Trip details">
      <p>Trip: one weekend away</p>
      <p>Travellers: 4</p>
    </section>
    <section class="pay" aria-label="Booking">
      <button class="button" type="button">Count us in</button>
    </section>
    <p class="help">Stuck? Your trip organizer has the answers.</p>
  </main>
  <svg class="zigzag" viewBox="0 0 320 240" aria-hidden="true" focusable="false">
    <path d="M20 230 L100 160 L80 140 L180 110 L150 80 L290 20" fill="none" stroke="currentColor" stroke-width="22" stroke-linejoin="miter" />
  </svg>
</body>
</html>
